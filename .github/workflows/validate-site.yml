name: Validate website

on:
  pull_request:
    paths:
      - '_config.yml'
      - '_data/**'
      - '_includes/**'
      - '_layouts/**'
      - '_pages/**'
      - '_sass/**'
      - 'assets/**'
      - 'images/**'
      - '.github/workflows/validate-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the GitHub Pages Jekyll engine
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Keep the rendered website for review
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: _site/
          retention-days: 7
